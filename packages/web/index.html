<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- partial-paint(FOUC) 가림 — CSS link 24개가 일부만 cascade된 상태에서의 첫 paint가
       grid 변수 unresolved → 콘텐츠 block stack 형태로 노출되는 현상을 막는다.
       opacity 0으로 시작 → 모든 CSS + React init 완료(.app-ready)되면 120ms fade-in.
       visibility 대신 opacity를 쓰는 이유: 접근성(스크린리더) 영향 0.
       backup으로 window.load 도달 시 무조건 .app-ready 부여 (인라인 스크립트 내) — main.tsx 실패에도 영구 hidden 방지. -->
  <style>
    html:not(.app-ready) body { opacity: 0; }
    html.app-ready body { opacity: 1; transition: opacity 120ms ease-out; }
  </style>
  <script>
    // FOUC 방지 — react-i18next(main.tsx module) 초기화 전에 URL ?lang= / localStorage / navigator
    // 우선순위로 lang을 결정해 <html lang>을 즉시 설정. 이게 없으면 첫 페인트가
    // 항상 ko로 렌더되어 :lang() CSS pseudo-content·스크린리더가 한국어로 한 번 잡힌 뒤
    // i18n 초기화 후 다른 언어로 깜빡임(FOUC) 발생.
    // (resolveInitialLang(lib/i18n.ts)와 동일 우선순위·동일 localStorage 키 'spyglass:lang' — 정합.)
    // 우선순위: URL ?lang → localStorage 'spyglass:lang' → navigator.language → 'ko'
    (function () {
      var SUPPORTED = ['ko', 'en', 'ja', 'zh'];
      function pick() {
        try {
          var url = new URLSearchParams(window.location.search).get('lang');
          if (url && SUPPORTED.indexOf(url) >= 0) return url;
        } catch (_) {}
        try {
          var stored = localStorage.getItem('spyglass:lang');
          if (stored && SUPPORTED.indexOf(stored) >= 0) return stored;
        } catch (_) {}
        var navs = navigator.languages || [navigator.language || ''];
        for (var i = 0; i < navs.length; i++) {
          var primary = String(navs[i]).split('-')[0].toLowerCase();
          if (SUPPORTED.indexOf(primary) >= 0) return primary;
        }
        return 'ko';
      }
      document.documentElement.lang = pick();
    })();
  </script>
  <script>
    // 레이아웃 시프트 방지 — main.tsx(module) 로드 전에 영속 상태를 첫 paint에 미리 반영.
    // 시프트가 발생하던 4 항목 모두 처리:
    //   1) --left-panel-width  (raw number, panel-resize.js)
    //   2) left-panel-hidden   (JSON "true"/"false", layout-persist.js + 옛 키 fallback)
    //   3) chart-collapsed     (JSON "true"/"false", layout-persist.js)
    //   4) .app-ready          (window.load — React init과 분리한 안전망)
    // clamp 범위는 design-tokens.css의 --panel-resize-min/max(144/384)와 일치.
    (function () {
      function readNum(key) {
        try { var v = parseInt(localStorage.getItem(key), 10); return Number.isFinite(v) ? v : NaN; }
        catch (_) { return NaN; }
      }
      function readBool(key) {
        try { return localStorage.getItem(key) === 'true'; }
        catch (_) { return false; }
      }
      var html = document.documentElement;

      // (1) 좌측 패널 너비
      var w = readNum('spyglass:panel-width');
      if (Number.isFinite(w) && w >= 144 && w <= 384) {
        html.style.setProperty('--left-panel-width', w + 'px');
      }

      // (2) 좌측 패널 접힘 — 신규 키 우선, 옛 키(migrate 전) fallback
      if (readBool('spyglass:left-panel-hidden') || readBool('left-panel-hidden')) {
        html.classList.add('preinit-left-panel-hidden');
      }

      // (3) 차트 접힘
      if (readBool('spyglass:chart-collapsed')) {
        html.classList.add('preinit-chart-collapsed');
      }

      // (4) .app-ready 부여 안전망 — React init이 통상 더 빠르게 부여하지만(idempotent),
      //     init이 실패하거나 늦으면 body가 영구 hidden 되므로 fallback 필수.
      //     window.load 는 CSS + 이미지 + module 스크립트까지 모두 로드 후 fire → partial paint 노출 없음 보장.
      window.addEventListener('load', function () {
        html.classList.add('app-ready');
      });
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Spyglass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- 데몬(/assets/css/*) 정적 서빙 CSS 24종은 externalizeDaemonAssets() plugin(vite.config.ts)이
       빌드/dev 양쪽에서 <head> 끝에 주입한다(Vite 가 번들 그래프로 끌어가지 않도록 외부화). -->
</head>
<body>
  <!-- React 마운트 루트 — App(AppShell+AppRoutes) 트리가 페이지 전체 chrome+레이아웃을 소유. -->
  <div id="react-root"></div>

  <!-- lang-switcher 는 React 컴포넌트(src/components/LangSwitcher.tsx)로 전환됨 — 과거 정적 classic
       island + lang-switcher.js + i18n-dom.js 결선은 제거되었다. <option>/SUPPORTED_LANGS drift 회귀
       가드의 SoT 는 컴포넌트 + drift 테스트로 이전. i18n 은 react-i18next(lib/i18n.ts) 단일 — 과거
       classic i18n.js(window.I18n) 전역은 완전히 제거됐다. -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
