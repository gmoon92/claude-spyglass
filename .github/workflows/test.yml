name: test
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [storage, server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/${{ matrix.package }} --bail
        env:
          TMPDIR: /tmp/spyglass-ci-${{ matrix.package }}-${{ github.run_id }}

  web-typecheck:
    name: web typecheck (checkJs, non-blocking)
    runs-on: ubuntu-latest
    # 비차단: web은 buildless ESM + JS이고 @ts-check가 파일 단위로만 적용된다(T08).
    # checkJs 베이스라인 에러가 0이 아니므로 게이트로 강제하지 않는다.
    # T09에서 @ts-check 점진 적용으로 에러를 0까지 줄인 뒤 차단 모드로 승격한다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/web typecheck

  contract:
    name: read-endpoint contract
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/server/src/__tests__/read-endpoint-contract.test.ts

  flow-patterns:
    name: flow pattern (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [unit]
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/storage/src/__tests__/meta-document-flow-patterns.test.ts

  isolation-grep:
    name: isolation gate (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: PR diff must not touch ACTIVE_REQUEST_FILTER_SQL
        run: |
          git diff origin/main...HEAD -- packages/storage/src/queries/request/read.ts | \
            grep -q 'ACTIVE_REQUEST_FILTER_SQL' && exit 1 || exit 0
      - name: PR diff must not touch shared MetaFlowEgo types
        run: |
          git diff origin/main...HEAD -- packages/storage/src/queries/meta-document.ts | \
            grep -E '^[+-].*export (interface|type) MetaFlowEgo(Edge|Node)' && exit 1 || exit 0
