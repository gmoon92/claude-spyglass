name: test
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # P5-07: web 은 러너를 Vitest 로 전환(아래 web-unit job). storage/server 는 bun test 유지.
        package: [storage, server]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/${{ matrix.package }} --bail
        env:
          TMPDIR: /tmp/spyglass-ci-${{ matrix.package }}-${{ github.run_id }}

  web-unit:
    name: unit (web — Vitest)
    runs-on: ubuntu-latest
    # P5-07: Vite 생태계 통일 — web 단위 테스트 러너를 bun test → Vitest 로 전환(단계적 전환의 마지막).
    #   package.json "test": "vitest run" 을 bun 으로 구동. jsdom 환경·TZ=UTC 는 vitest.config.ts/setup 에서 고정.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/web test

  web-typecheck:
    name: web typecheck (checkJs, blocking)
    runs-on: ubuntu-latest
    # R5(2026-05-30): @ts-check + JSDoc 보강으로 181개 에러를 0으로 줄임.
    # globals.d.ts ambient 보강 + 파일별 수정으로 타입 계약 확정 → CI 차단 모드 승격.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/web typecheck

  contract:
    name: read-endpoint contract
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/server/src/__tests__/read-endpoint-contract.test.ts

  flow-patterns:
    name: flow pattern (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [unit]
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.2.x' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test packages/storage/src/__tests__/meta-document-flow-patterns.test.ts

  isolation-grep:
    name: isolation gate (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: PR diff must not touch ACTIVE_REQUEST_FILTER_SQL
        run: |
          git diff origin/main...HEAD -- packages/storage/src/queries/request/read.ts | \
            grep -q 'ACTIVE_REQUEST_FILTER_SQL' && exit 1 || exit 0
      - name: PR diff must not touch shared MetaFlowEgo types
        run: |
          git diff origin/main...HEAD -- packages/storage/src/queries/meta-document.ts | \
            grep -E '^[+-].*export (interface|type) MetaFlowEgo(Edge|Node)' && exit 1 || exit 0
