#
# release.yml — tag push 시 Homebrew tarball 자동 빌드 · GitHub Release 게시 · tap repo Formula bump.
#
# 책임:
#   1) macos-14 (Apple Silicon) runner 에서 standalone bun bin + 자원 staging.
#   2) tar.gz 산출물을 GitHub Release 에 업로드.
#   3) gmoon92/homebrew-spyglass 의 Formula/spyglass.rb 의 url+sha256 자동 갱신.
#
# 트리거:
#   git tag v2.10.0 && git push origin v2.10.0
#
# 의존성:
#   - scripts/build-release-tarball.sh
#   - oven-sh/setup-bun@v2
#   - softprops/action-gh-release@v2
#   - mislav/bump-homebrew-formula-action@v4
#
# Secrets:
#   HOMEBREW_TAP_TOKEN — tap repo(gmoon92/homebrew-spyglass) 에 push 가능한 PAT (repo + workflow scope).
#
# 비범위:
#   - 코드 서명(Apple Developer ID), notarization 은 본 워크플로 범위 밖.
#   - Linux / macOS x64 빌드는 Phase 5 (현재 arm64 만 게시).

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # GitHub Release 생성

jobs:
  build-darwin-arm64:
    name: Build standalone tarball (darwin-arm64)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.3.12 darwin-arm64 sig_size 잘림 버그는 본 워크플로의 codesign 단계에서 우회.
          # 새 Bun release 가 안정화되면 갱신.
          bun-version: "1.3.12"

      - name: Resolve version from tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build release tarball (arm64)
        run: |
          ./scripts/build-release-tarball.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --arch arm64 \
            --out-dir dist/release

      - name: Sanity check — bin runs
        run: |
          BIN="dist/release/spyglass-${{ steps.ver.outputs.version }}-darwin-arm64/bin/spyglass"
          test -x "$BIN" || { echo "bin not executable"; exit 1; }
          # codesign 검증 — ad-hoc 서명 확인
          codesign -dv "$BIN" 2>&1 || true
          # spctl 은 ad-hoc 서명을 거부하지만, 검증 출력 자체는 정보로 남김.
          spctl --assess --type execute "$BIN" 2>&1 || echo "[release] spctl: ad-hoc signature (expected — not Developer ID)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/spyglass-${{ steps.ver.outputs.version }}-darwin-arm64.tar.gz
            dist/release/spyglass-${{ steps.ver.outputs.version }}-darwin-arm64.tar.gz.sha256
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease }}
          generate_release_notes: true

  bump-homebrew-formula:
    name: Bump Homebrew Formula
    needs: build-darwin-arm64
    runs-on: ubuntu-latest
    # 사전 릴리스(v2.10.0-rc.1 등)는 tap 갱신 안 함 — stable 사용자에게 RC 가 노출되지 않게.
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 5

    steps:
      - name: Resolve version (strip v-prefix)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump Formula in gmoon92/homebrew-spyglass
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: spyglass
          formula-path: Formula/spyglass.rb
          homebrew-tap: gmoon92/homebrew-spyglass
          base-branch: main
          # download-sha256 는 미지정 — action 이 런타임에 url 의 sha256 을 직접 계산해 패치한다.
          # tag 는 v-prefix 포함(v2.10.0), tarball 이름은 미포함(spyglass-2.10.0-...).
          download-url: https://github.com/gmoon92/claude-spyglass/releases/download/${{ github.ref_name }}/spyglass-${{ steps.ver.outputs.version }}-darwin-arm64.tar.gz
          commit-message: |
            spyglass ${{ steps.ver.outputs.version }}

            Auto-bumped by release workflow at gmoon92/claude-spyglass.
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
