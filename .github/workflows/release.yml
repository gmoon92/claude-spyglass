#
# release.yml — tag push 시 멀티플랫폼 standalone bin 자동 빌드 · GitHub Release 게시 (tarball-only 배포).
#
# 책임:
#   1) matrix runner(macos-14 / ubuntu / windows) 에서 standalone bun bin + 자원 staging.
#      - darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64.
#   2) 각 산출물(tar.gz | windows zip) + sha256 을 동일 GitHub Release 에 업로드.
#      배포는 GitHub Release 직접 다운로드(tarball-only). homebrew tap 자동 bump 미사용(tap repo 부재).
#
# 트리거:
#   git tag v3.1.0 && git push origin v3.1.0
#
# 의존성:
#   - scripts/build-release-tarball.sh (--os/--arch 파라미터화, web staging 은 tar 파이프 — rsync 비의존)
#   - oven-sh/setup-bun@v2
#   - softprops/action-gh-release@v2
#
# 비범위:
#   - 코드 서명(Apple Developer ID), notarization, windows authenticode 서명은 본 워크플로 범위 밖.
#     darwin 은 ad-hoc codesign 만, linux/windows 는 서명 없음.
#   - homebrew 배포: tap repo 미설정으로 tarball-only. 추후 homebrew 도입 시 bump 잡 + tap repo 별도 구성.
#
# 회귀 가드 (R6 멀티플랫폼):
#   - fail-fast: false — 한 OS runner 빌드 실패가 다른 OS 게시를 막지 않게 한다.
#   - 로컬에서는 호스트 크로스 컴파일(bun --target=bun-linux-x64 등)로 산출물 아키텍처(ELF/PE32+)만 확인 가능.
#     5개 OS runner 의 실제 게시는 tag push 에서 검증된다.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # GitHub Release 생성

jobs:
  # 릴리스를 단 한 번만 생성한다. 매트릭스 빌드 잡들이 동시에 softprops 로 생성하면
  # tag_name already_exists race(Validation Failed)로 일부 잡이 finalize 실패한다.
  # 생성을 이 잡 1곳으로 모으고, build 잡들은 gh release upload(추가만)로 자산만 올린다.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[release] $TAG 이미 존재 — 재사용(자산은 build 잡이 --clobber 업로드)"
          else
            PRE=""; [[ "$TAG" == *-* ]] && PRE="--prerelease"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes $PRE
          fi

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      # 한 OS 빌드 실패가 다른 OS(특히 darwin-arm64) 게시를 막지 않게 한다.
      fail-fast: false
      matrix:
        include:
          # darwin-arm64 — 기존 단일 job 과 동일. 회귀 0 기준선.
          - os: darwin
            arch: arm64
            runner: macos-14
          - os: darwin
            arch: x64
            runner: macos-14
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.3.12 darwin-arm64 sig_size 잘림 버그는 본 워크플로의 codesign 단계에서 우회.
          # 새 Bun release 가 안정화되면 갱신.
          bun-version: "1.3.12"

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # build-release-tarball.sh 는 bash 스크립트 — windows runner 에서도 setup-bun + git-bash 로 실행.
      - name: Build release archive (${{ matrix.os }}-${{ matrix.arch }})
        shell: bash
        run: |
          ./scripts/build-release-tarball.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --out-dir dist/release

      # codesign/spctl 검증은 darwin 에서만 (linux/windows 는 서명 없음).
      - name: Sanity check — darwin bin signature
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          BIN="dist/release/spyglass-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}/bin/spyglass"
          test -x "$BIN" || { echo "bin not executable"; exit 1; }
          # codesign 검증 — ad-hoc 서명 확인
          codesign -dv "$BIN" 2>&1 || true
          # spctl 은 ad-hoc 서명을 거부하지만, 검증 출력 자체는 정보로 남김.
          spctl --assess --type execute "$BIN" 2>&1 || echo "[release] spctl: ad-hoc signature (expected — not Developer ID)"

      # 자산 업로드: create-release 가 만든 릴리스에 추가만 한다(생성 race 없음).
      #   darwin/linux=.tar.gz(+.sha256), windows=.zip(+.sha256). `.*` glob 으로 존재 산출물만 매칭
      #   (확장자 없는 staging 디렉토리는 매칭 제외). --clobber 로 재실행 시 덮어쓰기 멱등.
      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.ver.outputs.version }}
          OSN: ${{ matrix.os }}
          ARCHN: ${{ matrix.arch }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/release/spyglass-${VER}-${OSN}-${ARCHN}.*
