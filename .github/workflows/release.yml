#
# release.yml — tag push 시 멀티플랫폼 standalone bin 자동 빌드 · GitHub Release 게시 · tap repo Formula bump.
#
# 책임:
#   1) matrix runner(macos-14 / ubuntu / windows) 에서 standalone bun bin + 자원 staging.
#      - darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64.
#   2) 각 산출물(tar.gz | windows zip) + sha256 을 동일 GitHub Release 에 업로드.
#   3) gmoon92/homebrew-spyglass 의 Formula/spyglass.rb 의 darwin-arm64 url+sha256 자동 갱신.
#
# 트리거:
#   git tag v3.0.7 && git push origin v3.0.7
#
# 의존성:
#   - scripts/build-release-tarball.sh (--os/--arch 파라미터화)
#   - oven-sh/setup-bun@v2
#   - softprops/action-gh-release@v2
#   - mislav/bump-homebrew-formula-action@v4
#
# Secrets:
#   HOMEBREW_TAP_TOKEN — tap repo(gmoon92/homebrew-spyglass) 에 push 가능한 PAT (repo + workflow scope).
#
# 비범위:
#   - 코드 서명(Apple Developer ID), notarization, windows authenticode 서명은 본 워크플로 범위 밖.
#     darwin 은 ad-hoc codesign 만, linux/windows 는 서명 없음.
#
# 회귀 가드 (R6 멀티플랫폼 확장):
#   - 기존 darwin-arm64 경로 회귀 0 이 최우선. matrix include 의 darwin-arm64 항목은
#     기존 단일 job 과 동일한 runner(macos-14)·bun-version(1.3.12)·산출물 이름
#     (spyglass-<v>-darwin-arm64.tar.gz)·codesign/spctl 검증을 그대로 수행한다.
#     Formula 의 arm64 url 이 이 산출물 이름에 의존하므로 절대 바꾸지 말 것.
#   - fail-fast: false — linux/windows runner 빌드 실패가 darwin-arm64 게시를 막지 않게 한다.
#   - 실제 멀티플랫폼 빌드·brew/zip install 검증은 tag push + 각 OS runner 에서만 가능하며 본 변경 범위 밖.
#     로컬에서는 arm64 호스트 크로스 컴파일(bun --target=bun-linux-x64 / bun-windows-x64 등)로
#     산출물 아키텍처(ELF/PE32+)만 확인했다. linux/windows runner 의 실제 게시는 첫 tag push 에서 검증된다.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # GitHub Release 생성

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      # 한 OS 빌드 실패가 다른 OS(특히 darwin-arm64) 게시를 막지 않게 한다.
      fail-fast: false
      matrix:
        include:
          # darwin-arm64 — 기존 단일 job 과 동일. 회귀 0 기준선.
          - os: darwin
            arch: arm64
            runner: macos-14
          - os: darwin
            arch: x64
            runner: macos-14
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.3.12 darwin-arm64 sig_size 잘림 버그는 본 워크플로의 codesign 단계에서 우회.
          # 새 Bun release 가 안정화되면 갱신.
          bun-version: "1.3.12"

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      # build-release-tarball.sh 는 bash 스크립트 — windows runner 에서도 setup-bun + git-bash 로 실행.
      - name: Build release archive (${{ matrix.os }}-${{ matrix.arch }})
        shell: bash
        run: |
          ./scripts/build-release-tarball.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --out-dir dist/release

      # codesign/spctl 검증은 darwin 에서만 (linux/windows 는 서명 없음).
      - name: Sanity check — darwin bin signature
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          BIN="dist/release/spyglass-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}/bin/spyglass"
          test -x "$BIN" || { echo "bin not executable"; exit 1; }
          # codesign 검증 — ad-hoc 서명 확인
          codesign -dv "$BIN" 2>&1 || true
          # spctl 은 ad-hoc 서명을 거부하지만, 검증 출력 자체는 정보로 남김.
          spctl --assess --type execute "$BIN" 2>&1 || echo "[release] spctl: ad-hoc signature (expected — not Developer ID)"

      # 산출물 확장자: darwin/linux=tar.gz, windows=zip. glob 으로 둘 다 매칭.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/spyglass-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dist/release/spyglass-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
            dist/release/spyglass-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.zip
            dist/release/spyglass-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256
          # darwin/linux 은 .tar.gz 만, windows 는 .zip 만 생성 → 매칭 안 되는 glob 이 정상 존재.
          # 매칭 0 인 glob 으로 job 이 실패하지 않게 한다(누락 산출물 무시).
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ steps.ver.outputs.is_prerelease }}
          generate_release_notes: true

  bump-homebrew-formula:
    name: Bump Homebrew Formula
    # build matrix 전체 완료 후 실행. fail-fast:false 이므로 일부 OS 실패해도
    # darwin-arm64 가 성공해 Release 에 올라가 있으면 bump 가능. needs 는 job 단위라
    # darwin-arm64 가 실패하면 bump 도 건너뛴다(arm64 url 이 깨진 채 tap 갱신되는 것 방지).
    needs: build
    runs-on: ubuntu-latest
    # 사전 릴리스(v2.10.0-rc.1 등)는 tap 갱신 안 함 — stable 사용자에게 RC 가 노출되지 않게.
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 5

    steps:
      - name: Resolve version (strip v-prefix)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ⚠️ 멀티플랫폼 자동 갱신 한계 (R6):
      #   mislav/bump-homebrew-formula-action 은 단일 download-url 의 url+sha256 만 패치한다.
      #   따라서 darwin-arm64 만 자동 bump 되고, Formula 의 나머지 3개 플랫폼
      #   (darwin-x64 / linux-x64 / linux-arm64) sha256 placeholder 는 수동 갱신이 필요하다.
      #   각 .tar.gz.sha256 산출물은 동일 Release 에 첨부되어 있으므로
      #   그 값으로 Formula 의 REPLACE_WITH_*_SHA256 을 채운 뒤 tap repo 에 push 한다.
      #   (무리한 다중 url 자동화로 arm64 회귀를 유발하지 않도록 의도적으로 단일 bump 유지.)
      - name: Bump Formula in gmoon92/homebrew-spyglass (darwin-arm64 only)
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: spyglass
          formula-path: Formula/spyglass.rb
          homebrew-tap: gmoon92/homebrew-spyglass
          base-branch: main
          # download-sha256 는 미지정 — action 이 런타임에 url 의 sha256 을 직접 계산해 패치한다.
          # tag 는 v-prefix 포함(v2.10.0), tarball 이름은 미포함(spyglass-2.10.0-...).
          download-url: https://github.com/gmoon92/claude-spyglass/releases/download/${{ github.ref_name }}/spyglass-${{ steps.ver.outputs.version }}-darwin-arm64.tar.gz
          commit-message: |
            spyglass ${{ steps.ver.outputs.version }}

            Auto-bumped by release workflow at gmoon92/claude-spyglass.
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
